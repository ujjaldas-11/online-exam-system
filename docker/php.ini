; ==============================================================================
; Examify - Production PHP Configuration
; Optimized for Air-Gapped High-Concurrency Examination Environments
; ==============================================================================

[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/www/html/logs/php_errors.log

max_execution_time = 60
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 10M
max_input_vars = 3000

date.timezone = "Asia/Kolkata"

; Production Session Security Settings
session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800

; Production OPcache Performance Settings
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1
