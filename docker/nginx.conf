# ==============================================================================
# Examify - Production Nginx Reverse Proxy / FastCGI Configuration
# Based on production.md guidelines
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 12M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static Assets Caching
    location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Real-Time WebSocket Proxy (WSS/WS -> internal WS daemon)
    location /ws/ {
        proxy_pass http://websocket:8085/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Default location router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny direct access to sensitive system files & directories
    location ~ /\.(env|git|htaccess|sql) {
        deny all;
        return 404;
    }

    location ~ ^/(config|archive|bin|logs)/ {
        deny all;
        return 404;
    }
}
