name: Format & Lint CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  text-format:
    name: Text Format (EditorConfig)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2

      - name: Run editorconfig-checker
        run: editorconfig-checker

  php-syntax:
    name: PHP Syntax Lint (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Check PHP Syntax on all files
        run: |
          find . -type f -name "*.php" ! -path "./vendor/*" ! -path "./.git/*" -print0 | xargs -0 -n 1 -P 4 php -l

  php-format:
    name: PHP Code Format (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP & PHP-CS-Fixer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer

      - name: Check PHP Formatting Standards
        run: php-cs-fixer fix --dry-run --diff --verbose --config=.php-cs-fixer.dist.php
